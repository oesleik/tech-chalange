name: IaC

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "infra/**"
      - ".github/workflows/iac.yml"
      - ".github/workflows/aws-deploy.yml"
      - ".github/workflows/aws-destroy.yml"
      - "charts/tech-challenge/**"

concurrency:
  group: iac-validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  validate:
    name: Terraform and Helm validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform fmt
        working-directory: infra
        run: terraform fmt -check -recursive -diff

      - name: Terraform init without backend
        working-directory: infra
        run: |
          rm -f backend.tf
          terraform init -backend=false -input=false

      - name: Terraform validate
        working-directory: infra
        run: terraform validate

      - name: Setup Helm
        uses: azure/setup-helm@v4.3.0
        with:
          version: v3.21.4

      - name: Helm lint — default values
        run: helm lint charts/tech-challenge

      - name: Helm lint — AWS values
        run: |
          helm lint charts/tech-challenge \
            -f charts/tech-challenge/values-aws.yaml

      - name: Render and validate AWS chart
        run: |
          helm template tech-challenge charts/tech-challenge \
            -f charts/tech-challenge/values-aws.yaml \
            --set-string config.DB_HOST=db.example.internal \
            --set-string secrets.DB_ROOT_PASSWORD=SECRET_MARKER_TEST \
            > "$RUNNER_TEMP/helm-aws-check.yaml"

          if grep -q 'SECRET_MARKER_TEST' "$RUNNER_TEMP/helm-aws-check.yaml"; then
            echo "::error::Senha administrativa apareceu no manifesto."
            exit 1
          fi

          if grep -Eq '^  name: (mysql|mysql-pvc|mysql-config|mysql-init-file)$' \
            "$RUNNER_TEMP/helm-aws-check.yaml"; then
            echo "::error::Um recurso do MySQL local foi renderizado no perfil AWS."
            exit 1
          fi

          if ! grep -q '^  name: rds-user-setup$' "$RUNNER_TEMP/helm-aws-check.yaml"; then
            echo "::error::O Job rds-user-setup não foi renderizado."
            exit 1
          fi

          echo "Helm AWS validado."
