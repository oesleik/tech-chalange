name: CI

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: php-cs-fixer

      - name: Run lint (php-cs-fixer)
        run: php-cs-fixer fix --dry-run --diff

  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: opentelemetry
          coverage: none
          tools: phpstan

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run SAST (phpstan)
        run: phpstan analyse src --no-interaction --no-progress --error-format=github

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Load vendor cache
        uses: actions/cache@v4
        id: composer-cache
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build PHP image
        uses: docker/build-push-action@v5
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: tech-challenge_php:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Instala com require-dev no volume vendor usado pelo compose
      - name: Install dependencies
        run: |
          docker compose run --rm -T --no-deps \
            -v $HOME/.composer/cache:/tmp/composer-cache \
            -e COMPOSER_CACHE_DIR=/tmp/composer-cache \
            php composer install --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: |
          mkdir -p coverage
          docker compose run --rm -T --no-deps --user "$(id -u):$(id -g)" php vendor/bin/phpunit --configuration phpunit.xml \
            --coverage-clover=coverage/clover.xml --coverage-html=coverage/html --log-junit=coverage/junit.xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage/html

      - name: SonarCloud Scan
        if: ${{ env.SONAR_TOKEN && env.SONAR_DISABLE_CI != 'true' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_DISABLE_CI: ${{ secrets.SONAR_DISABLE_CI }}
        uses: SonarSource/sonarqube-scan-action@master
        with:
          args: |
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
            -Dsonar.php.coverage.reportPaths=coverage/clover.xml
