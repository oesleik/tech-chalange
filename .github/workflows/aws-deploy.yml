name: AWS deploy

# Manual only. Push em master NÃO sobe cluster (plano GitHub Free sem required reviewers).
on:
  workflow_dispatch:
    inputs:
      node_instance_type:
        description: "Tipo de instância dos nós EKS"
        type: choice
        required: true
        default: t3.small
        options:
          - t3.small
          - t3.medium
          - t3.large

      rds_instance_class:
        description: "Classe da instância Amazon RDS MySQL"
        type: choice
        required: true
        default: db.t3.micro
        options:
          - db.t3.micro
          - db.t4g.micro

concurrency:
  group: aws-infra
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Plan, apply, Helm, migrate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Require master branch
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/master" ]; then
            echo "Rode este workflow com a branch master selecionada."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_APPLY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Configure remote state backend
        working-directory: infra
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_LOCK_TABLE: ${{ vars.TF_STATE_LOCK_TABLE }}
        run: |
          if [ -z "$TF_STATE_BUCKET" ] || [ -z "$TF_STATE_LOCK_TABLE" ]; then
            echo "Defina TF_STATE_BUCKET e TF_STATE_LOCK_TABLE (runbook_aws.md)."
            exit 1
          fi
          cat > backend.tf <<'EOF'
          terraform {
            backend "s3" {}
          }
          EOF
          cat > env/backend-aws.hcl <<EOF
          bucket         = "${TF_STATE_BUCKET}"
          key            = "tech-challenge/terraform.tfstate"
          region         = "${AWS_REGION}"
          dynamodb_table = "${TF_STATE_LOCK_TABLE}"
          encrypt        = true
          EOF

      - name: Terraform init
        working-directory: infra
        run: terraform init -backend-config=env/backend-aws.hcl

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # O archive_file do lambda.tf empacota o node_modules (mysql2) junto com o src/.
      - name: Install Lambda dependencies
        working-directory: lambda/autenticacao
        run: npm ci --omit=dev

      - name: Terraform plan
        working-directory: infra
        env:
          NODE_INSTANCE_TYPE: ${{ inputs.node_instance_type }}
          TF_VAR_rds_master_password: ${{ secrets.DB_ROOT_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_lambda_db_password: ${{ secrets.LAMBDA_DB_PASSWORD }}
          TF_VAR_rds_instance_class: ${{ inputs.rds_instance_class }}
          TF_VAR_eks_admin_principal_arns: ${{ vars.EKS_ADMIN_PRINCIPAL_ARNS || '[]' }}
        run: |
          terraform plan -var-file=env/aws.tfvars \
            -var="node_instance_types=[\"${NODE_INSTANCE_TYPE}\"]" \
            -out=tfplan -no-color

      - name: Terraform apply
        working-directory: infra
        run: terraform apply -auto-approve tfplan

      - name: Export RDS endpoint
        working-directory: infra
        run: |
          RDS_ENDPOINT="$(terraform output -raw rds_address)"
          if [ -z "$RDS_ENDPOINT" ]; then
            echo "::error::Endpoint do RDS não foi retornado pelo Terraform."
            exit 1
          fi
          echo "RDS_ENDPOINT=$RDS_ENDPOINT" >> "$GITHUB_ENV"

      - name: Install kubectl and Helm
        run: |
          curl -fsSL "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" -o /usr/local/bin/kubectl
          chmod +x /usr/local/bin/kubectl
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Configure kubeconfig
        run: aws eks update-kubeconfig --name tech-challenge --region "${AWS_REGION}"

      - name: Build and push PHP image
        working-directory: infra
        run: |
          ECR_URI="$(terraform output -raw ecr_repository_url)"
          echo "ECR_URI=${ECR_URI}" >> "$GITHUB_ENV"
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${ECR_URI}"
          docker build -t "${ECR_URI}:${GITHUB_SHA}" -t "${ECR_URI}:latest" ..
          docker push "${ECR_URI}:${GITHUB_SHA}"
          docker push "${ECR_URI}:latest"

      - name: Install metrics-server
        run: |
          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/
          helm repo update
          helm upgrade --install metrics-server metrics-server/metrics-server \
            --namespace kube-system \
            --set args={--kubelet-insecure-tls} \
            --wait --timeout 3m

      - name: Require New Relic secrets
        env:
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          NEW_RELIC_API_KEY: ${{ secrets.NEW_RELIC_API_KEY }}
          NEW_RELIC_ACCOUNT_ID: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
        run: |
          set -eu
          missing=0
          for name in NEW_RELIC_LICENSE_KEY NEW_RELIC_API_KEY NEW_RELIC_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "Secret ausente: ${name}. Defina em Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Create New Relic license secrets
        env:
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
        run: |
          set -eu
          for ns in newrelic tech-challenge; do
            kubectl create namespace "$ns" --dry-run=client -o yaml | kubectl apply -f -
            kubectl -n "$ns" create secret generic newrelic-license \
              --from-literal=license-key="$NEW_RELIC_LICENSE_KEY" \
              --dry-run=client -o yaml | kubectl apply -f -
          done

      - name: Install New Relic Kubernetes bundle
        run: |
          set -eu
          VERSION="$(tr -d '[:space:]' < charts/newrelic/VERSION)"
          helm repo add newrelic https://helm-charts.newrelic.com
          helm repo update
          helm upgrade --install newrelic-bundle newrelic/nri-bundle \
            --namespace newrelic --create-namespace \
            --version "$VERSION" \
            -f charts/newrelic/values.yaml \
            --wait --timeout 10m

      - name: Prepare RDS admin Secret
        env:
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          LAMBDA_DB_PASSWORD: ${{ secrets.LAMBDA_DB_PASSWORD }}
        run: |
          if [ -z "$DB_ROOT_PASSWORD" ] || [ -z "$LAMBDA_DB_PASSWORD" ]; then
            echo "::error::Configure os secrets DB_ROOT_PASSWORD e LAMBDA_DB_PASSWORD no GitHub."
            exit 1
          fi
          kubectl create namespace tech-challenge --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic rds-admin-secrets \
            --namespace tech-challenge \
            --from-literal=DB_ROOT_USERNAME=dbadmin \
            --from-literal="DB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}" \
            --from-literal="LAMBDA_DB_PASSWORD=${LAMBDA_DB_PASSWORD}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Helm upgrade
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OS_EMAIL_ACTION_TOKEN_SECRET: ${{ secrets.OS_EMAIL_ACTION_TOKEN_SECRET }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          python3 -c '
          import json, os, pathlib
          keys = (
            "DB_PASSWORD",
            "JWT_SECRET",
            "OS_EMAIL_ACTION_TOKEN_SECRET",
            "MAIL_USERNAME",
            "MAIL_PASSWORD",
          )
          pathlib.Path("/tmp/helm-app-secrets.json").write_text(json.dumps({
            "secrets": {k: os.environ[k] for k in keys}
          }))
          '
          helm upgrade --install tech-challenge charts/tech-challenge \
            --namespace tech-challenge --create-namespace \
            -f charts/tech-challenge/values-aws.yaml \
            -f /tmp/helm-app-secrets.json \
            --set "php.image=${ECR_URI}:${GITHUB_SHA}" \
            --set-string "config.DB_HOST=${RDS_ENDPOINT}" \
            --timeout 10m

      - name: Wait for RDS setup job and PHP
        run: |
          kubectl wait --namespace tech-challenge --for=condition=complete job/rds-user-setup --timeout=300s
          kubectl wait --namespace tech-challenge --for=condition=ready pod -l app=php --timeout=180s

      - name: Run database migrations
        run: kubectl exec --namespace tech-challenge deploy/php -- php src/cmd/migrations/migrate.php

      - name: Verify Nginx after migrations
        run: |
          kubectl rollout status deployment/nginx \
            --namespace tech-challenge \
            --timeout=180s

      - name: New Relic deployment marker
        if: success() && vars.NEW_RELIC_ENTITY_GUID != ''
        uses: newrelic/deployment-marker-action@v2.6.2
        with:
          apiKey: ${{ secrets.NEW_RELIC_API_KEY }}
          guid: ${{ vars.NEW_RELIC_ENTITY_GUID }}
          region: ${{ vars.NEW_RELIC_REGION || 'US' }}
          version: ${{ github.sha }}
          commit: ${{ github.sha }}
          user: ${{ github.actor }}

      - name: Clean up temporary database credentials
        if: always()
        run: |
          kubectl delete secret rds-admin-secrets --namespace tech-challenge --ignore-not-found=true || true
          rm -f /tmp/helm-app-secrets.json
      - name: Show API Gateway URL
        working-directory: infra
        run: |
          API_URL="$(terraform output -raw api_gateway_url)"
          echo "API Gateway: ${API_URL}"
          echo "### API Gateway: ${API_URL}" >> "$GITHUB_STEP_SUMMARY"
