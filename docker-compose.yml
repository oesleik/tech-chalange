# =====================================================
# docker-compose.yml
# Stack: Nginx + PHP 8.4 FPM + MySQL 9 + phpMyAdmin
# =====================================================
services:
  # --------------------------------------------------
  # Nginx — Servidor Web
  # --------------------------------------------------
  nginx:
    image: nginx:latest
    container_name: app_nginx
    restart: unless-stopped
    ports:
      - "80:80" # HTTP  → http://localhost
    volumes:
      - .:/var/www/html # código da aplicação
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf # config do Nginx
    depends_on:
      - php
    networks:
      - app_network

  # --------------------------------------------------
  # PHP-FPM 8.4 — Processador PHP
  # --------------------------------------------------
  php:
    image: tech-challenge_php:ci
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app_php
    restart: unless-stopped
    volumes:
      - .:/var/www/html # mesmo volume do Nginx
      - vendor:/var/www/html/vendor
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini # configurações extras
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-app_db}
      - DB_USERNAME=${DB_USERNAME:-app_user}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - APP_ENV=${APP_ENV:-production}
      - APP_URL=${APP_URL:-https://example.tech-challange.com}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_TTL=${JWT_TTL:-3600}
      - JWT_ISSUER=${JWT_ISSUER:-tech-challenge-api}
      - OS_EMAIL_ACTION_TOKEN_SECRET=${OS_EMAIL_ACTION_TOKEN_SECRET}
      - OS_EMAIL_ACTION_TOKEN_TTL=${OS_EMAIL_ACTION_TOKEN_TTL:-3600}
      - OS_EMAIL_ACTION_TOKEN_ISSUER=${OS_EMAIL_ACTION_TOKEN_ISSUER:-tech-challenge-api}
      - MAIL_HOST=${MAIL_HOST:-smtp.mailtrap.io}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-tls}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-no-reply@tech-challenge.com}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Tech Challenge}
      - OTEL_PHP_AUTOLOAD_ENABLED=${OTEL_PHP_AUTOLOAD_ENABLED:-true}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-tech-challenge-api}
      - OTEL_TRACES_SAMPLER=${OTEL_TRACES_SAMPLER:-always_on}
      - OTEL_EXPORTER_OTLP_PROTOCOL=${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      - OTEL_LOGS_EXPORTER=${OTEL_LOGS_EXPORTER:-otlp}
      - OTEL_METRICS_EXPORTER=${OTEL_METRICS_EXPORTER:-otlp}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app_network

  # --------------------------------------------------
  # MySQL 9 — Banco de Dados
  # --------------------------------------------------
  mysql:
    image: mysql:9
    container_name: app_mysql
    restart: unless-stopped
    ports:
      - "3307:3306" # expõe para conexão externa (ex: DBeaver, TablePlus)
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${DB_DATABASE:-app_db}
      MYSQL_USER: ${DB_USERNAME:-app_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql # persiste os dados
      - ./docker/mysql/init:/docker-entrypoint-initdb.d # scripts SQL de inicialização (opcional)
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_ROOT_PASSWORD:-rootsecret}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - app_network

  # --------------------------------------------------
  # phpMyAdmin — Interface Web para o MySQL
  # Acesse: http://localhost:8080
  # --------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: app_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80" # http://localhost:8080
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME:-app_user}
      PMA_PASSWORD: ${DB_PASSWORD:-secret}
      UPLOAD_LIMIT: 64M
    depends_on:
      - mysql
    networks:
      - app_network
    
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./docker/otel/config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    networks:
      - app_network
    depends_on:
      - jaeger
      - prometheus
      - loki

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"
      - "14250:14250"
    networks:
      - app_network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - app_network

  loki:
    image: grafana/loki:latest
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - app_network
    volumes:
      - ./docker/loki/local-config.yaml:/etc/loki/local-config.yaml:ro

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - app_network
    depends_on:
      - prometheus
      - loki
      - jaeger

# ------------------------------------------------------
# Volumes persistentes
# ------------------------------------------------------
volumes:
  mysql_data:
    driver: local
  vendor:
    driver: local
  prometheus_data:
  grafana_data:

# ------------------------------------------------------
# Rede interna
# ------------------------------------------------------
networks:
  app_network:
    driver: bridge
