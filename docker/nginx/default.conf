# docker/nginx/default.conf
server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;    # entry point do Slim Framework
    index index.php;

    # Compressão gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Security Headers
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none';" always;

    # Slim usa o Front Controller — todas as rotas passam pelo index.php
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # Resolver DNS interno do Docker (evita "host not found in upstream")
    resolver 127.0.0.11 valid=10s;
    set $php_upstream php:9000;

    # Passa requisições PHP para o PHP-FPM
    location ~ \.php$ {
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # Bloqueia acesso a arquivos ocultos (.env, .git, etc.)
    location ~ /\. {
        deny all;
    }

    # Cache de assets estáticos
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;
    }

    # Logs
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}