# Values do chart oficial newrelic/nri-bundle.
# Versão fixada em charts/newrelic/VERSION.
# A license key não fica aqui: o CI cria o Secret newrelic-license
# no namespace newrelic e o chart só referencia esse Secret.
# Nomes conferidos no values do nri-bundle 8.0.34
# (kubeEvents do roteiro passou a ser nri-kube-events).

global:
  cluster: tech-challenge-prod
  lowDataMode: true
  customSecretName: newrelic-license
  customSecretLicenseKey: license-key

newrelic-infrastructure:
  enabled: true

kube-state-metrics:
  enabled: true

nri-kube-events:
  enabled: true

newrelic-logging:
  enabled: false

nri-prometheus:
  enabled: false

nri-metadata-injection:
  enabled: false

newrelic-k8s-metrics-adapter:
  enabled: false
