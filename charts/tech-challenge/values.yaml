# Valores padrões. Sobrescritos por values-*.yaml

php:
  image: tech-challenge-php:latest
  imagePullPolicy: Never
  replicaCount: 2
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    cpuAverageUtilization: 70
    memoryAverageUtilization: 80

nginx:
  image: nginx:alpine
  replicaCount: 2
  resources:
    requests:
      memory: "64Mi"
      cpu: "100m"
    limits:
      memory: "128Mi"
      cpu: "200m"
  service:
    type: NodePort
    port: 80
    nodePort: 30080
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    cpuAverageUtilization: 70

mysql:
  image: mysql:9
  replicaCount: 1
  persistence:
    size: 5Gi
    storageClassName: ""
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

phpmyadmin:
  enabled: false
  image: phpmyadmin:latest
  service:
    type: NodePort
    port: 80
    nodePort: 30081
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

config:
  DB_HOST: "mysql"
  DB_PORT: "3306"
  DB_DATABASE: "app_db"
  DB_USERNAME: "app_user"
  APP_ENV: "production"
  APP_URL: "http://localhost"
  JWT_TTL: "3600"
  JWT_ISSUER: "tech-challenge-api"
  OS_EMAIL_ACTION_TOKEN_TTL: "3600"
  OS_EMAIL_ACTION_TOKEN_ISSUER: "tech-challenge-api"
  MAIL_HOST: "smtp.mailtrap.io"
  MAIL_PORT: "587"
  MAIL_ENCRYPTION: "tls"
  MAIL_FROM_ADDRESS: "no-reply@tech-challenge.com"
  MAIL_FROM_NAME: "Tech Challenge"

# Placeholders de desenvolvimento. Não use estes valores em produção.
secrets:
  DB_PASSWORD: "secret"
  DB_ROOT_PASSWORD: "rootsecret"
  JWT_SECRET: "troque-por-valor-seguro-em-producao"
  OS_EMAIL_ACTION_TOKEN_SECRET: "troque-por-valor-seguro-em-producao"
  MAIL_USERNAME: ""
  MAIL_PASSWORD: ""
