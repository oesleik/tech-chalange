# Valores padrões. Sobrescritos por values-aws.yaml (EKS) e pelo workflow de deploy.

php:
  # Sobrescrita no deploy (--set php.image) com a imagem do ECR.
  image: tech-challenge-php:latest
  imagePullPolicy: IfNotPresent
  replicaCount: 2
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    cpuAverageUtilization: 70
    memoryAverageUtilization: 80

nginx:
  image: nginx:alpine
  replicaCount: 2
  resources:
    requests:
      memory: "64Mi"
      cpu: "100m"
    limits:
      memory: "128Mi"
      cpu: "200m"
  service:
    type: NodePort
    port: 80
    nodePort: 30080
    annotations: {}
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    cpuAverageUtilization: 70

config:
  # Sobrescrito no deploy (--set-string config.DB_HOST) com o SSM /tech-challenge/db/address.
  DB_HOST: "RDS_ENDPOINT_SET_BY_DEPLOY_WORKFLOW"
  DB_PORT: "3306"
  DB_DATABASE: "app_db"
  DB_USERNAME: "app_user"
  APP_ENV: "production"
  APP_URL: "http://localhost"
  JWT_TTL: "3600"
  JWT_ISSUER: "tech-challenge-api"
  OS_EMAIL_ACTION_TOKEN_TTL: "3600"
  OS_EMAIL_ACTION_TOKEN_ISSUER: "tech-challenge-api"
  MAIL_HOST: "smtp.mailtrap.io"
  MAIL_PORT: "587"
  MAIL_ENCRYPTION: "tls"
  MAIL_FROM_ADDRESS: "no-reply@tech-challenge.com"
  MAIL_FROM_NAME: "Tech Challenge"

# Placeholders de desenvolvimento. Não use estes valores em produção.
secrets:
  DB_PASSWORD: "secret"
  JWT_SECRET: "troque-por-valor-seguro-em-producao"
  OS_EMAIL_ACTION_TOKEN_SECRET: "troque-por-valor-seguro-em-producao"
  MAIL_USERNAME: ""
  MAIL_PASSWORD: ""

# Desligado por padrão. O Secret da license key não é criado por este chart.
newrelic:
  enabled: false
  appName: tech-challenge
  existingSecret: newrelic-license
  secretKey: license-key
  logForwarding: true

# Usuários do RDS criados pelo job rds-user-setup. A senha do master e da Lambda vêm do
# Secret rds-admin-secrets, criado pelo workflow de deploy.
database:
  # Mesmo valor de lambda_db_username no tech-challenge-lambda.
  lambdaUsername: "autenticacao"
