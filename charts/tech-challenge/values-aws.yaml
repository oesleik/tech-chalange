# AWS real

php:
  # ACCOUNT_ID é só placeholder, o valor real é sobrescrito em CI
  image: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/tech-challenge-php:latest
  imagePullPolicy: Always
  replicaCount: 1
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 4
    cpuAverageUtilization: 70
    memoryAverageUtilization: 80
  # +64Mi para o daemon do agente PHP. O HPA de memória usa o request como base.
  resources:
    requests:
      memory: "192Mi"
      cpu: "50m"
    limits:
      memory: "320Mi"
      cpu: "250m"

newrelic:
  enabled: true
  appName: tech-challenge-prod

nginx:
  replicaCount: 1
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    cpuAverageUtilization: 70
  resources:
    requests:
      memory: "32Mi"
      cpu: "20m"
    limits:
      memory: "64Mi"
      cpu: "100m"
  service:
    type: NodePort
    port: 80
    nodePort: 30080
