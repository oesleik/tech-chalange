apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  labels:
    {{- include "tech-challenge.labels" . | nindent 4 }}
type: Opaque
stringData:
{{ range $key, $value := .Values.secrets }}
{{ if or (not $.Values.externalDatabase.enabled) (ne $key "DB_ROOT_PASSWORD") }}
  {{ $key }}: {{ $value | quote }}
{{ end }}
{{ end }}
