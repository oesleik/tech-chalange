apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: tech-challenge
# Opaque = tipo generico para dados arbitrarios
type: Opaque
# stringData aceita texto puro, o K8s converte para base64 automaticamente
stringData:
  DB_PASSWORD: "secret"
  DB_ROOT_PASSWORD: "rootsecret"
  JWT_SECRET: "troque-por-valor-seguro-em-producao"
  OS_EMAIL_ACTION_TOKEN_SECRET: "troque-por-valor-seguro-em-producao"
  MAIL_USERNAME: ""
  MAIL_PASSWORD: ""
  