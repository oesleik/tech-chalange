apiVersion: v1
kind: Service
metadata:
  name: nginx
  labels:
    app: nginx
    {{- include "tech-challenge.labels" . | nindent 4 }}
spec:
  selector:
    app: nginx
  type: {{ .Values.nginx.service.type }}
  ports:
    - port: {{ .Values.nginx.service.port }}
      targetPort: 80
      {{- if eq .Values.nginx.service.type "NodePort" }}
      nodePort: {{ .Values.nginx.service.nodePort }}
      {{- end }}
