apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: tech-challenge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      # initContainer roda antes do nginx e copia os arquivos estaticos da imagem PHP
      initContainers:
        - name: copy-public
          image: tech-challenge-php:latest
          imagePullPolicy: Never
          # copia tudo de /var/www/html/public para o volume compartilhado
          command: ['sh', '-c', 'cp -r /var/www/html/public/. /public/']
          volumeMounts:
            - name: public-files
              mountPath: /public

      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            # monta o ConfigMap como arquivo de configuracao no container
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
            # nginx serve os arquivos estaticos do volume compartilhado com o initContainer
            - name: public-files
              mountPath: /var/www/html/public
          # Nginx tem endpoint HTTP, entao podemos verificar diretamente
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      volumes:
        # associa o nome "nginx-config" ao ConfigMap criado no nginx-configmap.yaml
        - name: nginx-config
          configMap:
            name: nginx-config
        # volume temporario compartilhado entre initContainer e nginx
        - name: public-files
          emptyDir: {}
