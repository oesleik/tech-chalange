{{- if .Values.externalDatabase.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: rds-user-setup
  labels:
    app: rds-user-setup
    {{- include "tech-challenge.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: rds-user-setup
    spec:
      restartPolicy: Never
      containers:
        - name: initialize-user
          image: mysql:8.4
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              cat > /tmp/client.cnf <<EOF
              [client]
              host=${DB_HOST}
              port=${DB_PORT}
              user=${DB_ROOT_USERNAME}
              password=${DB_ROOT_PASSWORD}
              EOF

              chmod 600 /tmp/client.cnf
              trap 'rm -f /tmp/client.cnf' EXIT

              mysql --defaults-extra-file=/tmp/client.cnf \
                --connect-timeout=10 \
                --execute="
                  CREATE USER IF NOT EXISTS '${DB_USERNAME}'@'%' IDENTIFIED BY '${DB_PASSWORD}';
                  ALTER USER '${DB_USERNAME}'@'%' IDENTIFIED BY '${DB_PASSWORD}';
                  GRANT ALL PRIVILEGES ON \`${DB_DATABASE}\`.* TO '${DB_USERNAME}'@'%';
                  CREATE USER IF NOT EXISTS '${LAMBDA_DB_USERNAME}'@'%' IDENTIFIED BY '${LAMBDA_DB_PASSWORD}' REQUIRE SSL;
                  ALTER USER '${LAMBDA_DB_USERNAME}'@'%' IDENTIFIED BY '${LAMBDA_DB_PASSWORD}' REQUIRE SSL;
                  GRANT SELECT ON \`${DB_DATABASE}\`.* TO '${LAMBDA_DB_USERNAME}'@'%';
                  FLUSH PRIVILEGES;
                "
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_PORT
            - name: DB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_DATABASE
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD
            # Usuário somente leitura da Lambda de autenticação (infra/lambda.tf).
            - name: LAMBDA_DB_USERNAME
              value: {{ .Values.externalDatabase.lambdaUsername | quote }}
            - name: LAMBDA_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rds-admin-secrets
                  key: LAMBDA_DB_PASSWORD
            - name: DB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rds-admin-secrets
                  key: DB_ROOT_USERNAME
            - name: DB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rds-admin-secrets
                  key: DB_ROOT_PASSWORD
{{- end }}
