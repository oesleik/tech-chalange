{{- if .Values.mysql.persistence.storageClass.create }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.mysql.persistence.storageClass.name }}
  labels:
    {{- include "tech-challenge.labels" . | nindent 4 }}
  {{- if .Values.mysql.persistence.storageClass.default }}
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
  {{- end }}
provisioner: {{ .Values.mysql.persistence.storageClass.provisioner }}
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
parameters:
  {{- toYaml .Values.mysql.persistence.storageClass.parameters | nindent 2 }}
{{- end }}
