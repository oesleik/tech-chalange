apiVersion: v1
kind: Secret
metadata:
  name: mysql-init-file
  labels:
    {{- include "tech-challenge.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Uma statement por linha (exigência do --init-file). Roda a cada start do mysqld.
  # MYSQL_USER do entrypoint só vale com datadir vazio; isto cobre PVC já inicializado.
  grant.sql: |
    CREATE USER IF NOT EXISTS '{{ .Values.config.DB_USERNAME }}'@'%' IDENTIFIED BY '{{ .Values.secrets.DB_PASSWORD }}';
    ALTER USER '{{ .Values.config.DB_USERNAME }}'@'%' IDENTIFIED BY '{{ .Values.secrets.DB_PASSWORD }}';
    GRANT ALL PRIVILEGES ON `{{ .Values.config.DB_DATABASE }}`.* TO '{{ .Values.config.DB_USERNAME }}'@'%';
    FLUSH PRIVILEGES;
