services:
  ministack:
    image: ministackorg/ministack:latest
    ports:
      - "4566:4566"
    environment:
      LOG_LEVEL: INFO
      DOCKER_NETWORK: ministack_default
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    privileged: true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
